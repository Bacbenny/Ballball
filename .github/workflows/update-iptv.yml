name: Tu dong cap nhat IPTV

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: update-iptv
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auto-redeploy CF Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN:         ${{ secrets.CF_API_TOKEN }}
          RELAY_SECRET:         ${{ secrets.RELAY_SECRET }}
        run: python deploy_workers.py || echo "Worker deploy skipped"

      - name: Run IPTV updater
        env:
          RELAY_SECRET:   ${{ secrets.RELAY_SECRET }}
          VTV_M3U_URL:    ${{ secrets.VTV_M3U_URL }}
          PHAOHOA_API:    ${{ secrets.PHAOHOA_API }}
          PHAOHOA_FRONTEND: ${{ secrets.PHAOHOA_FRONTEND }}
          MATCH_MAX_DURATION: ${{ secrets.MATCH_MAX_DURATION }}
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Action Bot"
          git add dekki.m3u
          if git diff --staged --quiet; then
            echo "Khong co thay doi. Bo qua commit."
          else
            TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S ICT')
            git commit -m "cap nhat dekki.m3u luc ${TIMESTAMP} [skip ci]"
            git pull --rebase origin xemtv
            git push origin xemtv
          fi
